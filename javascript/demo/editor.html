<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Automerge Oblivious Text Editor — Demo</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      padding: 2em;
    }
    h1 { color: #00d230; }
    #status { color: #888; margin-bottom: 1em; }
    #editor {
      border: 1px solid #555;
      padding: 1em;
      min-height: 3em;
      background: #1a1a1a;
      cursor: text;
      outline: none;
    }
    #editor:focus {
      border-color: #00d230;
    }
    securetext {
      display: block;
      font-size: 18px;
      line-height: 1.5;
    }
    .error { color: #f44; }
    .info { color: #4af; }
    #hint { color: #666; margin-top: 0.5em; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Automerge Oblivious Text Editor</h1>
  <div id="status">Checking window.oblivious...</div>
  <div id="editor" tabindex="0"></div>
  <div id="hint">Click the box and type. Arrow keys to move cursor. Backspace to delete.</div>
  <div id="log" class="info" style="margin-top: 1em; font-size: 14px; white-space: pre-wrap;"></div>

  <script type="module">
    import * as Automerge from './automerge-oblivious.js';

    const status = document.getElementById('status');
    const editor = document.getElementById('editor');
    const logEl = document.getElementById('log');

    function log(msg) {
      logEl.textContent += msg + '\n';
    }

    if (!window.oblivious) {
      status.textContent = 'window.oblivious not available. Enable dom.oblivious.enabled in about:config.';
      status.classList.add('error');
      throw new Error('window.oblivious not available');
    }

    const oc = window.oblivious;

    if (typeof oc.createArray !== 'function') {
      throw new Error('window.oblivious.createArray not available — rebuild Firefox with ObliviousArray support');
    }

    // ── Wire browser backends ──────────────────────────────────────────

    Automerge.initBrowserBackend(oc);
    Automerge.setBrowserBackend(() => oc.createArray());
    log('Browser backends wired');

    // ── Create document ────────────────────────────────────────────────

    const ONE = oc.createInt(1);
    const ZERO = oc.createInt(0);
    let cursor = oc.createInt(0);

    // Standard DOM keyCodes as ObliviousInt constants
    const KC_BACKSPACE = oc.createInt(8);
    const KC_DELETE = oc.createInt(46);
    const KC_LEFT = oc.createInt(37);
    const KC_RIGHT = oc.createInt(39);

    // ObliviousEdit action enum
    const ACTION_INSERT = oc.createInt(0);
    const ACTION_BACKSPACE = oc.createInt(1);
    const ACTION_DELETE = oc.createInt(2);
    const ACTION_NOOP = oc.createInt(3);

    let doc = Automerge.init();
    doc = Automerge.change(doc, d => {
      d.chars = [];
    });

    // Insert initial text (sealing boundary — plaintext init is acceptable)
    doc = Automerge.change(doc, d => {
      for (const ch of 'Hello') {
        d.chars.push(Automerge.makeSelectable(oc.createString(ch)));
      }
    });
    cursor = oc.createInt(doc.chars.length);
    log(`Initialized with "Hello"`);

    // ── Render ─────────────────────────────────────────────────────────

    const secureEl = document.createElement('securetext');
    editor.appendChild(secureEl);

    function render() {
      const chars = doc.chars;
      if (!chars || chars.length === 0) {
        secureEl.value = '';
        status.textContent = `Empty document.`;
        return;
      }

      const charArrays = Array.from({ length: chars.length }, (_, i) => chars[i]);
      Automerge.renderObliviousText(charArrays, secureEl, oc);
      secureEl.setObliviousCursor(cursor);

      status.textContent = `${chars.length} chars`;
    }

    render();

    // ── Keyboard input ─────────────────────────────────────────────────
    // All key values arrive as ObliviousByteArrays via SecureKeyboardEvent.
    // Every keystroke executes identical operations; cmov selects the result.

    secureEl.addEventListener('securekeydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      const keyCode = Automerge.makeSelectable(e.keyCode);
      const key = Automerge.makeSelectable(e.key);

      // Classify key via oblivious integer comparison
      const isBS = oc.eqInt(keyCode, KC_BACKSPACE);
      const isDel = oc.eqInt(keyCode, KC_DELETE);
      const isLeft = oc.eqInt(keyCode, KC_LEFT);
      const isRight = oc.eqInt(keyCode, KC_RIGHT);
      const isArrow = oc.orBool(isLeft, isRight);
      const isControl = oc.orBool(oc.orBool(isBS, isDel), isArrow);
      const isPrintable = oc.notBool(isControl);

      // Select action as ObliviousInt via chained cmov
      let action = ACTION_INSERT;
      action = oc.cmovArray(isBS, ACTION_BACKSPACE, action);
      action = oc.cmovArray(isDel, ACTION_DELETE, action);
      action = oc.cmovArray(isArrow, ACTION_NOOP, action);

      // Buffer mutation — single call, branching happens in C++
      doc = Automerge.change(doc, d => {
        d.chars.obliviousEdit(cursor, action, key);
      });

      // Cursor update — ObliviousInt arithmetic + cmov
      const dec = oc.subInt(cursor, ONE);
      const inc = oc.addInt(cursor, ONE);
      const canDec = oc.gtInt(cursor, ZERO);
      const canInc = oc.gtInt(oc.createInt(doc.chars.length), cursor);

      let newCursor = cursor;
      newCursor = oc.cmovArray(isBS, oc.cmovArray(canDec, dec, cursor), newCursor);
      newCursor = oc.cmovArray(isLeft, oc.cmovArray(canDec, dec, cursor), newCursor);
      newCursor = oc.cmovArray(isRight, oc.cmovArray(canInc, inc, cursor), newCursor);
      newCursor = oc.cmovArray(isPrintable, inc, newCursor);
      cursor = newCursor;

      render();
    });

    // Sync cursor from visual caret position on click.
    secureEl.addEventListener('click', () => {
      cursor = Automerge.makeSelectable(secureEl.getSelectionStart());
    });

    editor.focus();
  </script>
</body>
</html>
