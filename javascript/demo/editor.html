<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Automerge Oblivious Text Editor — Demo</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      padding: 2em;
    }
    h1 { color: #00d230; }
    #status { color: #888; margin-bottom: 1em; }
    #output {
      border: 1px solid #333;
      padding: 1em;
      min-height: 3em;
      background: #1a1a1a;
    }
    securetext {
      display: block;
      font-size: 18px;
      line-height: 1.5;
    }
    .error { color: #f44; }
    .info { color: #4af; }
  </style>
</head>
<body>
  <h1>Automerge Oblivious Text Editor</h1>
  <div id="status">Checking window.oblivious...</div>
  <div id="output"></div>
  <div id="log" class="info" style="margin-top: 1em; font-size: 14px; white-space: pre-wrap;"></div>

  <script type="module">
    // Requires: dom.oblivious.enabled = true, dom.encryptedtext.enabled = true
    import * as Automerge from './automerge-oblivious.js';

    const status = document.getElementById('status');
    const output = document.getElementById('output');
    const logEl = document.getElementById('log');

    function log(msg) {
      logEl.textContent += msg + '\n';
    }

    if (!window.oblivious) {
      status.textContent = 'window.oblivious not available. Enable dom.oblivious.enabled in about:config.';
      status.classList.add('error');
      throw new Error('window.oblivious not available');
    }

    const oc = window.oblivious;

    // ── Wire browser backends ──────────────────────────────────────────

    Automerge.initBrowserBackend(oc);
    Automerge.setBrowserBackend(() => oc.createArray());
    log('Browser backends wired: initBrowserBackend + setBrowserBackend');

    // ── Helper: render doc.chars to <securetext> ───────────────────────

    function renderDoc(doc) {
      output.innerHTML = '';
      const chars = doc.chars;
      if (!chars || chars.length === 0) return;

      Automerge.renderObliviousText(
        Array.from({ length: chars.length }, (_, i) => chars[i]),
        output.querySelector('securetext') || (() => {
          const st = document.createElement('securetext');
          output.appendChild(st);
          return st;
        })(),
        oc,
      );
    }

    // ── Create document and insert initial text via Automerge.change ──

    const s = Automerge.createObliviousString;

    let doc = Automerge.init();
    log(`Automerge.init() done`);

    doc = Automerge.change(doc, d => {
      d.chars = [];
    });
    log(`Created chars list, length: ${doc.chars.length}`);

    doc = Automerge.change(doc, d => {
      const text = 'Hello';
      for (const ch of text) {
        d.chars.push(s(ch));
      }
    });
    log(`After inserting "Hello": length=${doc.chars.length}`);
    renderDoc(doc);

    // ── Edit: insert " CRDT" at position 5 ─────────────────────────────

    setTimeout(() => {
      doc = Automerge.change(doc, d => {
        const text = ' CRDT';
        for (let i = 0; i < text.length; i++) {
          d.chars.insertAt(5 + i, s(text[i]));
        }
      });
      log(`After inserting " CRDT" at 5: length=${doc.chars.length}`);
      renderDoc(doc);
    }, 500);

    // ── Edit: delete last character ─────────────────────────────────────

    setTimeout(() => {
      doc = Automerge.change(doc, d => {
        d.chars.deleteAt(d.chars.length - 1, 1);
      });
      log(`After deleting last char: length=${doc.chars.length}`);
      renderDoc(doc);
    }, 1000);

    // ── Fork and concurrent edit ────────────────────────────────────────

    setTimeout(() => {
      const fork = Automerge.clone(doc);
      log(`Forked document, fork length=${fork.chars.length}`);

      doc = Automerge.change(doc, d => {
        d.chars.insertAt(0, s('!'));
      });

      log(`Original after prepending "!": length=${doc.chars.length}`);
      renderDoc(doc);

      status.textContent =
        `Automerge oblivious demo: ${doc.chars.length} characters. ` +
        `All edits via Automerge.change() with ObliviousArray backend. ` +
        `Values have validity bytes; cursor positions stay in C++.`;
    }, 1500);
  </script>
</body>
</html>
