<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Automerge Oblivious Sync Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #eee;
      font-family: monospace;
      margin: 0;
      padding: 1em;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 { color: #00d230; margin: 0 0 0.5em; font-size: 20px; }
    .three-column {
      display: grid;
      grid-template-columns: 2fr 3fr 2fr;
      flex: 1;
      gap: 1em;
      min-height: 0;
    }
    .col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    .editor-status {
      color: #888;
      font-size: 13px;
      margin-bottom: 0.3em;
    }
    .editor-frame {
      flex: 1;
      width: 100%;
      border: none;
      min-height: 0;
    }
    #sync-log {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #333;
      background: #0d0d0d;
      padding: 0.5em;
      font-size: 12px;
      font-family: monospace;
      min-height: 0;
    }
    .log-entry {
      margin-bottom: 0.6em;
      padding: 0.3em 0.5em;
      border-left: 3px solid #333;
    }
    .log-entry.a-send { border-left-color: #4af; }
    .log-entry.a-receive { border-left-color: #8cf; }
    .log-entry.b-send { border-left-color: #f4a; }
    .log-entry.b-receive { border-left-color: #f8c; }
    .log-header { color: #aaa; margin-bottom: 0.2em; }
    .log-header .direction { font-weight: bold; }
    .log-field { color: #666; word-break: break-all; line-height: 1.3; }
    .log-field .label { color: #888; }
    .log-field .value { color: #a0ffa0; }
    #hint {
      color: #555;
      font-size: 12px;
      margin-top: 0.5em;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Automerge Oblivious Sync Demo</h1>
  <div id="pref-warning" style="display:none; background:#331; border:1px solid #663; color:#ffa; padding:0.6em 1em; margin-bottom:0.5em; font-size:13px;">
    Required prefs not enabled. In <b>about:config</b>, set <code>dom.oblivious.enabled</code> and <code>dom.encryptedtext.enabled</code> to <b>true</b>, then reload.
  </div>
  <script>
    if (!window.oblivious || !document.createElement('securetext').setObliviousCursor) {
      document.getElementById('pref-warning').style.display = 'block';
    }
  </script>
  <div class="three-column">
    <div class="col">
      <div class="editor-status" id="status-a">Editor A -- initializing...</div>
      <iframe id="frame-a" class="editor-frame"
              src="sync-editor.html?id=A&seed=Hello"></iframe>
    </div>
    <div class="col">
      <div id="sync-log"></div>
    </div>
    <div class="col">
      <div class="editor-status" id="status-b">Editor B -- initializing...</div>
      <iframe id="frame-b" class="editor-frame"
              src="sync-editor.html?id=B"></iframe>
    </div>
  </div>
  <div id="hint">Type in either editor. Edits sync via WebSocket relay.</div>

  <script>
    const syncLog = document.getElementById('sync-log');
    const statusA = document.getElementById('status-a');
    const statusB = document.getElementById('status-b');
    let msgCount = 0;

    function decodeLEB128(data, offset) {
      let result = 0, shift = 0, pos = offset;
      while (pos < data.length) {
        const byte = data[pos];
        result |= (byte & 0x7f) << shift;
        pos++;
        if ((byte & 0x80) === 0) break;
        shift += 7;
      }
      return [result, pos];
    }

    function bytesToBase64(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    function b64preview(data, offset, len) {
      return bytesToBase64(data.slice(offset, offset + len)).slice(0, 5) + '...';
    }

    const ENC_32 = 64, ENC_5 = 37, ENC_1 = 33;

    function decodeSyncMsg(msg) {
      let pos = 1;
      let count;
      [count, pos] = decodeLEB128(msg, pos);
      const numHeads = count;
      pos += count * 32;
      [count, pos] = decodeLEB128(msg, pos);
      const numNeed = count;
      pos += count * 32;
      [count, pos] = decodeLEB128(msg, pos);
      const numHave = count;
      for (let i = 0; i < count; i++) {
        let syncCount;
        [syncCount, pos] = decodeLEB128(msg, pos);
        pos += syncCount * 32;
        let bloomLen;
        [bloomLen, pos] = decodeLEB128(msg, pos);
        pos += bloomLen;
      }
      [count, pos] = decodeLEB128(msg, pos);
      const changes = [];
      for (let i = 0; i < count; i++) {
        let changeLen;
        [changeLen, pos] = decodeLEB128(msg, pos);
        changes.push(msg.slice(pos, pos + changeLen));
        pos += changeLen;
      }
      return { numHeads, numNeed, numHave, changes };
    }

    function appendLog(from, direction, syncMsg) {
      msgCount++;
      const arrow = direction === 'send' ? 'send' : 'recv';
      const cls = `${from.toLowerCase()}-${direction}`;
      const parsed = decodeSyncMsg(syncMsg);
      const entry = document.createElement('div');
      entry.className = `log-entry ${cls}`;

      let html = `<div class="log-header"><span class="direction">#${msgCount} ${from} ${arrow}</span></div>`;
      html += `<div class="log-field"><span class="label">heads:</span> <span class="value">${parsed.numHeads}</span>  `;
      html += `<span class="label">need:</span> <span class="value">${parsed.numNeed}</span>  `;
      html += `<span class="label">have:</span> <span class="value">${parsed.numHave}</span></div>`;

      if (parsed.changes.length === 0) {
        html += `<div class="log-field"><span class="label">changes:</span> <span class="value">0 (ack)</span></div>`;
      } else {
        html += `<div class="log-field"><span class="label">changes:</span> <span class="value">${parsed.changes.length}</span></div>`;
        for (const change of parsed.changes) {
          const view = new DataView(change.buffer, change.byteOffset, change.byteLength);
          const lamport = Number(view.getBigUint64(0));
          const actorLen = change[8];
          const actor = new TextDecoder().decode(change.slice(9, 9 + actorLen));
          let p = 9 + actorLen;
          const eid = b64preview(change, p, ENC_32); p += ENC_32;
          const pid = b64preview(change, p, ENC_32); p += ENC_32;
          const sk  = b64preview(change, p, ENC_32); p += ENC_32;
          const val = b64preview(change, p, ENC_5);  p += ENC_5;
          const vld = b64preview(change, p, ENC_1);  p += ENC_1;
          const tei = b64preview(change, p, ENC_32); p += ENC_32;
          const tvl = b64preview(change, p, ENC_1);  p += ENC_1;
          const tvv = b64preview(change, p, ENC_5);
          html += `<div class="log-field">  <span class="label">lamport:</span> <span class="value">${lamport}</span>  <span class="label">actor:</span> <span class="value">${actor}</span></div>`;
          html += `<div class="log-field">  <span class="label">elem_id:</span> <span class="value">${eid}</span>  <span class="label">predecessor_id:</span> <span class="value">${pid}</span>  <span class="label">sort_key:</span> <span class="value">${sk}</span></div>`;
          html += `<div class="log-field">  <span class="label">value:</span> <span class="value">${val}</span>  <span class="label">valid:</span> <span class="value">${vld}</span></div>`;
          html += `<div class="log-field">  <span class="label">target_elem_id:</span> <span class="value">${tei}</span>  <span class="label">target_valid:</span> <span class="value">${tvl}</span>  <span class="label">target_value:</span> <span class="value">${tvv}</span></div>`;
        }
      }

      entry.innerHTML = html;
      syncLog.appendChild(entry);
      syncLog.scrollTop = syncLog.scrollHeight;
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data?.type) return;

      if (data.type === 'status-update') {
        const el = data.id === 'A' ? statusA : data.id === 'B' ? statusB : null;
        if (el) el.textContent = data.text;
      } else if (data.type === 'sync-log') {
        const msg = new Uint8Array(data.syncMsg);
        appendLog(data.from, data.direction, msg);
      }
    });
  </script>
</body>
</html>
