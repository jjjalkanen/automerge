<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sync Editor</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #eee;
      font-family: monospace;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #editor {
      flex: 1;
      border: 1px solid #555;
      padding: 0.5em;
      background: #1a1a1a;
      cursor: text;
      outline: none;
      font-family: monospace;
      min-width: 0;
      min-height: 0;
      word-wrap: break-word;
      overflow-wrap: break-word;
      overflow-y: auto;
    }
    #editor:focus-within {
      border-color: #00d230;
    }
    securetext {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      cursor: text;
      font-family: monospace;
      font-size: 18px;
      line-height: 1.5;
      color: inherit;
      min-width: unset;
      min-height: unset;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
  </style>
</head>
<body>
  <div id="editor" tabindex="0"></div>

  <script type="module">
    import init, { ObliviousText, initSyncState, setObliviousRef } from './automerge_wasm.js';

    const params = new URLSearchParams(location.search);
    const editorId = params.get('id') || '?';
    const wsUrl = params.get('ws') || `ws://${location.host}/ws`;
    const seed = params.get('seed') || '';

    const editor = document.getElementById('editor');

    function setStatus(text) {
      try { parent.postMessage({ type: 'status-update', id: editorId, text }, '*'); } catch {}
    }

    if (!window.oblivious) {
      setStatus(`Editor ${editorId} -- enable dom.oblivious.enabled in about:config`);
      throw new Error('window.oblivious not available');
    }

    const oc = window.oblivious;

    try {
    await init();
    setObliviousRef(oc);

    const actorId = editorId + '-' + Math.random().toString(36).slice(2, 10);
    const crdt = new ObliviousText(actorId);
    let syncState = initSyncState();

    const secureEl = document.createElement('securetext');
    editor.appendChild(secureEl);

    window._oc = oc;
    window._crdt = crdt;
    window._cursor = oc.createInt(0);
    window._cursorPos = 0;
    window._visibleCount = 0;

    function scopedGc(watermark) {
      const live = crdt.collectLiveHandleIds();
      oc.h_freeAboveWatermark(live, watermark);
    }

    function renderFromBuffer() {
      try {
        const buffer = crdt.getRenderBuffer();
        if (buffer.length === 0) {
          secureEl.value = '';
          setStatus(`Editor ${editorId} -- empty -- ready`);
          return;
        }
        let combined = buffer[0];
        for (let i = 1; i < buffer.length; i++) {
          combined = oc.concatArrays(combined, buffer[i]);
        }
        secureEl.value = combined.toBase64();
        secureEl.setObliviousCursor(window._cursor);
        setStatus(`Editor ${editorId} -- ${buffer.length} chars -- ready`);
      } catch (e) {
        console.error('[render]', e);
        setStatus(`Editor ${editorId} -- render error: ${e.message}`);
      }
    }

    // -- WebSocket sync -----------------------------------------------

    let ws = null;
    let wsReady = false;

    function connectWs() {
      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        wsReady = true;
        setStatus(`Editor ${editorId} -- connected -- ready`);
        sendSync();
      };

      ws.onmessage = (event) => {
        try {
          const wm = oc.h_watermark();
          const msg = new Uint8Array(event.data);
          crdt.receiveSyncMessage(syncState, msg);
          renderFromBuffer();
          scopedGc(wm);
          postLog('receive', msg);
          sendSync();
        } catch (err) {
          console.error('[sync receive]', err);
          setStatus(`Editor ${editorId} -- sync error: ${err.message || err}`);
        }
      };

      ws.onclose = () => {
        wsReady = false;
        setTimeout(connectWs, 1000);
      };
    }

    function sendSync() {
      if (!wsReady) return;
      let rounds = 0;
      while (rounds++ < 10) {
        const msg = crdt.generateSyncMessage(syncState);
        if (!msg) break;
        ws.send(msg);
        postLog('send', msg);
      }
    }

    function postLog(direction, msg) {
      try {
        window.parent.postMessage({
          type: 'sync-log',
          from: editorId,
          direction,
          syncMsg: Array.from(new Uint8Array(msg)),
        }, '*');
      } catch {}
    }

    // -- Seed initial content -----------------------------------------

    if (seed) {
      const insertAction = oc.fromByte(1);
      for (const ch of seed) {
        const kc = oc.createInt(ch.charCodeAt(0));
        const result = crdt.obliviousEdit(kc, insertAction, window._cursor);
        window._cursor = result.newCursor;
        window._cursorPos++;
        window._visibleCount++;
      }
      renderFromBuffer();
    }

    // -- Keystroke handling -------------------------------------------

    function updatePlainCursor(action, cursorPos, visibleCount) {
      let newPos = cursorPos, newCount = visibleCount;
      if (action === 1) { newPos++; newCount++; }
      else if (action === 2 && cursorPos > 0) { newPos--; newCount--; }
      else if (action === 3 && cursorPos < visibleCount) { newCount--; }
      return { pos: newPos, count: newCount };
    }

    secureEl.addEventListener('securekeydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      try {
        const result = crdt.obliviousEdit(e.charCode, e.actionType, window._cursor);
        window._cursor = result.newCursor;
        const u = updatePlainCursor(e.plainAction, window._cursorPos, window._visibleCount);
        window._cursorPos = u.pos;
        window._visibleCount = u.count;
        secureEl.value = result.content;
        secureEl.setObliviousCursor(window._cursor);
        setStatus(`Editor ${editorId} -- ready`);
        sendSync();
      } catch (err) {
        console.error('[obliviousEdit]', err);
        setStatus(`Editor ${editorId} -- error: ${err.message}`);
      }
    });

    for (const dir of ['securecursorleft', 'securecursorright']) {
      secureEl.addEventListener(dir, () => {
        if (dir === 'securecursorleft' && window._cursorPos > 0) {
          window._cursorPos--;
          window._cursor = oc.createInt(window._cursorPos);
        } else if (dir === 'securecursorright' && window._cursorPos < window._visibleCount) {
          window._cursorPos++;
          window._cursor = oc.createInt(window._cursorPos);
        }
        secureEl.setObliviousCursor(window._cursor);
      });
    }

    secureEl.addEventListener('click', () => {
      window._cursor = secureEl.getSelectionStart();
    });

    // -- Start --------------------------------------------------------

    connectWs();
    setStatus(`Editor ${editorId} -- ready`);
    editor.focus();

    } catch (e) {
      console.error('[init]', e);
      setStatus(`Editor ${editorId} -- init error: ${e.message}`);
    }
  </script>
</body>
</html>
