<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sync Editor</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      padding: 0.5em;
      margin: 0;
    }
    #status { color: #888; margin-bottom: 0.5em; font-size: 13px; }
    #editor {
      border: 1px solid #555;
      padding: 0.5em;
      min-height: 2em;
      background: #1a1a1a;
      cursor: text;
      outline: none;
    }
    #editor:focus-within {
      border-color: #00d230;
    }
    securetext {
      display: block;
      font-size: 18px;
      line-height: 1.5;
    }
    .error { color: #f44; }
  </style>
</head>
<body>
  <div id="status">Initializing WASM…</div>
  <div id="editor" tabindex="0"></div>

  <script type="module">
    import init, { ObliviousText, initSyncState, setObliviousRef } from './automerge_wasm.js';

    const editorId = new URLSearchParams(location.search).get('id') || '?';

    const status = document.getElementById('status');
    const editor = document.getElementById('editor');

    if (!window.oblivious) {
      status.textContent = 'Enable dom.oblivious.enabled and dom.encryptedtext.enabled in about:config';
      status.classList.add('error');
      throw new Error('window.oblivious not available');
    }

    const oc = window.oblivious;

    try {
    await init();
    setObliviousRef(oc);

    const actorId = editorId + '-' + Math.random().toString(36).slice(2, 10);
    const crdt = new ObliviousText(actorId);
    let syncState = initSyncState();

    const secureEl = document.createElement('securetext');
    editor.appendChild(secureEl);

    // Expose globals for E2E test harness
    window._oc = oc;
    window._crdt = crdt;
    window._cursor = oc.createInt(0);
    window._cursorPos = 0;
    window._visibleCount = 0;

    function renderFromBuffer() {
      try {
        const buffer = crdt.getRenderBuffer();
        if (buffer.length === 0) {
          secureEl.value = '';
          status.textContent = `Editor ${editorId} — empty — ready`;
          return;
        }
        let combined = buffer[0];
        for (let i = 1; i < buffer.length; i++) {
          combined = oc.concatArrays(combined, buffer[i]);
        }
        secureEl.value = combined.toBase64();
        secureEl.setObliviousCursor(window._cursor);
        status.textContent = `Editor ${editorId} — ${buffer.length} chars — ready`;
      } catch (e) {
        console.error('[render]', e);
        status.textContent = `Editor ${editorId} — render error: ${e.message}`;
      }
    }

    // Only Editor A seeds initial text; B receives it via sync
    if (editorId === 'A') {
      const insertAction = oc.fromByte(1);
      for (const ch of 'Hello') {
        const kc = oc.createInt(ch.charCodeAt(0));
        const result = crdt.obliviousEdit(kc, insertAction, window._cursor);
        window._cursor = result.newCursor;
        window._cursorPos++;
        window._visibleCount++;
      }
      renderFromBuffer();
      setTimeout(() => sendSync(), 100);
    }

    function sendSync() {
      const msg = crdt.generateSyncMessage(syncState);
      if (msg) {
        window.parent.postMessage({
          from: editorId,
          syncMsg: Array.from(new Uint8Array(msg)),
        }, '*');
      }
    }
    window._sendSync = sendSync;
    window._renderFromBuffer = renderFromBuffer;

    // Keystroke handling
    function updatePlainCursor(action, cursorPos, visibleCount) {
      let newPos = cursorPos, newCount = visibleCount;
      if (action === 1) { newPos++; newCount++; }
      else if (action === 2 && cursorPos > 0) { newPos--; newCount--; }
      else if (action === 3 && cursorPos < visibleCount) { newCount--; }
      return { pos: newPos, count: newCount };
    }

    secureEl.addEventListener('securekeydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      try {
        const result = crdt.obliviousEdit(e.charCode, e.actionType, window._cursor);
        window._cursor = result.newCursor;
        const u = updatePlainCursor(e.plainAction, window._cursorPos, window._visibleCount);
        window._cursorPos = u.pos;
        window._visibleCount = u.count;
        secureEl.value = result.content;
        secureEl.setObliviousCursor(window._cursor);
        status.textContent = `Editor ${editorId} — ready`;
        sendSync();
      } catch (err) {
        console.error('[obliviousEdit]', err);
        status.textContent = `Editor ${editorId} — error: ${err.message}`;
      }
    });

    for (const dir of ['securecursorleft', 'securecursorright']) {
      secureEl.addEventListener(dir, () => {
        if (dir === 'securecursorleft' && window._cursorPos > 0) {
          window._cursorPos--;
          window._cursor = oc.createInt(window._cursorPos);
        } else if (dir === 'securecursorright' && window._cursorPos < window._visibleCount) {
          window._cursorPos++;
          window._cursor = oc.createInt(window._cursorPos);
        }
        secureEl.setObliviousCursor(window._cursor);
      });
    }

    secureEl.addEventListener('click', () => {
      window._cursor = secureEl.getSelectionStart();
    });

    // Receive sync messages from other editor via parent relay
    window.addEventListener('message', (event) => {
      const { syncMsg } = event.data || {};
      if (!syncMsg) return;

      try {
        const message = new Uint8Array(syncMsg);
        crdt.receiveSyncMessage(syncState, message);
        renderFromBuffer();
        sendSync();
      } catch (err) {
        console.error('[sync receive]', err);
        status.textContent = `Editor ${editorId} — sync error: ${err.message || err}`;
      }
    });

    status.textContent = `Editor ${editorId} — ready`;
    editor.focus();
    } catch (e) {
      console.error('[init]', e);
      status.textContent = `Editor ${editorId} — init error: ${e.message}`;
      status.classList.add('error');
    }
  </script>
</body>
</html>
